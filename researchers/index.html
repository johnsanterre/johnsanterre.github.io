<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Researcher Cards</title>
<style>
:root{--bg:#14121f;--panel:#1d1a2c;--panel2:#25213a;--ink:#ece9f6;--muted:#a49fbd;--line:#37314f;--accent:#c792ea;--ok:#7fd1a8;--warn:#f0b470;--bad:#ef8a8a;--link:#9ccfff}
@media (prefers-color-scheme: light){:root:not([data-theme="dark"]){--bg:#f6f5fa;--panel:#fff;--panel2:#f0eef7;--ink:#1d1a2c;--muted:#615c78;--line:#dcd8ea;--accent:#7b3fb3;--ok:#1f8a5a;--warn:#a8650f;--bad:#b23a3a;--link:#1d5fa8}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,sans-serif}
a{color:var(--link);text-decoration:none}a:hover{text-decoration:underline}
header{padding:16px;border-bottom:1px solid var(--line);display:flex;flex-wrap:wrap;gap:10px;align-items:center}
header h1{font-size:18px;margin:0 12px 0 0}
header .meta{color:var(--muted);font-size:13px;flex-basis:100%}
input,select{background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:6px;padding:7px 9px;font:inherit;font-size:14px}
input[type=search]{flex:1;min-width:200px}
main{display:grid;grid-template-columns:minmax(260px,360px) 1fr;height:calc(100vh - 100px)}
#list{overflow:auto;border-right:1px solid var(--line)}
.row{padding:9px 14px;border-bottom:1px solid var(--line);cursor:pointer}
.row:hover,.row.sel{background:var(--panel2)}
.row .n{font-weight:600}.row .s{color:var(--muted);font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .h{float:right;color:var(--muted);font-size:12px}
#card{overflow:auto;padding:20px 28px 60px}
.card h2{margin:0;font-size:26px}
.one{color:var(--muted);margin:4px 0 10px}
.chips span{display:inline-block;border:1px solid var(--line);border-radius:999px;padding:1px 9px;margin:0 6px 6px 0;font-size:12.5px}
.chips .ok{border-color:var(--ok);color:var(--ok)}.chips .warn{border-color:var(--warn);color:var(--warn)}.chips .bad{border-color:var(--bad);color:var(--bad)}
section{margin-top:18px;padding-top:12px;border-top:1px solid var(--line)}
section h3{margin:0 0 8px;font-size:12.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--accent)}
section .gap{color:var(--muted);font-style:italic}
.src{font-size:12px;color:var(--muted)}.src a{color:var(--muted);text-decoration:underline}
ul{margin:4px 0;padding-left:18px}li{margin:3px 0}
.stats{display:flex;gap:26px;flex-wrap:wrap}.stats b{display:block;font-size:22px}.stats small{color:var(--muted)}
.tag{font-size:11.5px;border-radius:4px;padding:0 5px;margin-left:6px;border:1px solid var(--line);color:var(--muted)}
.tag.ok{color:var(--ok);border-color:var(--ok)}.tag.bad{color:var(--bad);border-color:var(--bad)}
.star{background:none;border:0;padding:0 6px 0 0;margin:0;font:inherit;font-size:17px;line-height:1;color:var(--muted);cursor:pointer;vertical-align:-1px}
.star.on{color:var(--warn)}.jstar{color:var(--accent);font-size:12px;margin-left:6px}
.jnote{border-left:3px solid var(--accent);background:var(--panel2);padding:8px 12px;margin:12px 0;border-radius:4px}.jnote b{color:var(--accent)}
.jp{font-size:13px;color:var(--muted);white-space:nowrap}.hidebtn{background:none;border:1px solid var(--line);color:var(--muted);border-radius:6px;font:inherit;font-size:12px;padding:2px 8px;cursor:pointer;margin-left:10px;vertical-align:4px}
.life{color:var(--muted);font-size:15px;font-weight:400;margin-left:8px}.star:hover{color:var(--warn)}
h2 .star{font-size:24px;vertical-align:2px}
#dl{color:inherit;white-space:nowrap}
@media (max-width:760px){main{grid-template-columns:minmax(0,1fr);height:auto}#list{max-height:40vh}#card{padding:16px;overflow-wrap:anywhere}input[type=search]{min-width:0;flex-basis:100%}select{max-width:100%;min-width:0}}
</style>
<script data-goatcounter="https://johnsanterre.goatcounter.com/count" async src="//gc.zgo.at/count.js"></script>
</head>
<body>
<header>
  <h1>Researcher Cards</h1>
  <a class="navlink" href="map.html" style="color:inherit;white-space:nowrap">Map of 5,091 academics</a> <a class="navlink" href="classic/" style="color:inherit;white-space:nowrap">Classic hand-picked map</a>
  <label class="jp"><input type="checkbox" id="jp" checked> Show John's stars and notes</label>
  <a id="dl" href="#" hidden>Download my stars</a>
  <input type="search" id="q" placeholder="Search name, university, topic, award…" autocomplete="off">
  <select id="cat"><option value="">All categories</option></select>
  <select id="uni"><option value="">All universities</option></select>
  <select id="stage"><option value="">All career stages</option><option value="senior">Senior researchers</option><option value="mid">Mid-career</option><option value="early">Up and coming</option><option value="none">Career stage not known</option></select>
  <select id="show"><option value="">Everyone</option><option value="john">John's picks</option><option value="mine">My stars</option><option value="hidden">People I hid</option></select>
  <select id="sort"><option value="h">Sort: OpenAlex h-index</option><option value="name">Sort: name</option><option value="scholar">Sort: Google Scholar citations</option><option value="awards">Sort: awards</option></select>
  <div class="meta" id="meta"></div>
</header>
<main><div id="list"></div><div id="card"></div></main>
<script src="cards/cards.js"></script>
<script>
const C = window.CARDS || [], M = window.CARDS_META || {};
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const host = u => { try { return new URL(u).hostname.replace(/^www\./, ""); } catch (e) { return u; } };
const src = (u, label) => u ? `<span class="src">source: <a href="${esc(u)}" target="_blank" rel="noopener">${esc(label || host(u))}</a></span>` : "";
const uniOf = c => c.where?.university || c.where?.csrankings?.affiliation || "";
const hay = c => [c.name, ...(c.aliases||[]), uniOf(c), c.where?.dept, ...(c.topics||[]), ...(c.recognition||[]).map(a => a.award), c.one_line].join(" ").toLowerCase();
C.forEach(c => c._hay = hay(c));
const byId = Object.fromEntries(C.map(c => [c.id, c]));
// Stars live in this browser only (localStorage); the download link exports them.
const SK = "researcher-cards-stars";
const HK = "researcher-cards-hidden", JK = "researcher-cards-show-john";
let stars = new Set(), hidden = new Set(), cur = null;
try { stars = new Set(JSON.parse(localStorage.getItem(SK) || "[]")); hidden = new Set(JSON.parse(localStorage.getItem(HK) || "[]")); if (localStorage.getItem(JK) === "0") $("#jp").checked = false; } catch (e) {}
const showJohn = () => $("#jp").checked;
const nJohn = C.filter(c => c.john).length;
const starBtn = id => `<button class="star${stars.has(id) ? " on" : ""}" data-star="${esc(id)}" aria-pressed="${stars.has(id)}" title="Star this researcher">${stars.has(id) ? "★" : "☆"}</button>`;
function refreshStars() {
  $("#show option[value=mine]").textContent = `My stars (${stars.size})`;
  $("#show option[value=hidden]").textContent = `People I hid (${hidden.size})`;
  $("#show option[value=john]").textContent = `John's picks (${nJohn})`;
  $("#show option[value=john]").hidden = !showJohn();
  $("#dl").hidden = !stars.size;
  document.querySelectorAll("[data-star]").forEach(b => { const on = stars.has(b.dataset.star); b.classList.toggle("on", on); b.textContent = on ? "★" : "☆"; b.setAttribute("aria-pressed", on); });
}
function toggleStar(id) {
  stars.has(id) ? stars.delete(id) : stars.add(id);
  try { localStorage.setItem(SK, JSON.stringify([...stars])); } catch (e) {}
  if ($("#show").value === "mine") list();
  refreshStars();
}
function toggleHide(id) {
  hidden.has(id) ? hidden.delete(id) : hidden.add(id);
  try { localStorage.setItem(HK, JSON.stringify([...hidden])); } catch (e) {}
  list(); show(id);
}
$("#meta").textContent = `${M.count.toLocaleString()} researchers · every fact links to its source · built ${M.generated}`;
const CATS = ["Statistics", "Computer science", "AI", "Machine learning", "Deep learning", "Other fields"];
CATS.forEach(k => $("#cat").insertAdjacentHTML("beforeend", `<option value="${k}">${k} (${C.filter(c => (c.categories || []).includes(k)).length})</option>`));
$("#cat").insertAdjacentHTML("beforeend", `<option value="none">Not yet classified (${C.filter(c => !(c.categories || []).length).length})</option>`);
const STAGE = { senior: "Senior researcher", mid: "Mid-career", early: "Up and coming" };
[...new Set(C.map(uniOf).filter(Boolean))].sort().forEach(u => $("#uni").insertAdjacentHTML("beforeend", `<option>${esc(u)}</option>`));

function list() {
  const q = $("#q").value.trim().toLowerCase(), u = $("#uni").value, k = $("#cat").value, g = $("#stage").value, sh = $("#show").value, s = $("#sort").value;
  let r = C.filter(c => (!q || q.split(/\s+/).every(t => c._hay.includes(t))) && (!u || uniOf(c) === u)
    && (!k || (k === "none" ? !(c.categories || []).length : (c.categories || []).includes(k)))
    && (!g || (g === "none" ? !c.stage : c.stage === g))
    && (sh === "hidden" ? hidden.has(c.id) : !hidden.has(c.id))
    && (sh !== "mine" || stars.has(c.id)) && (sh !== "john" || (showJohn() && c.john)));
  const f = sh === "mine" ? "starred" : sh;
  if (s === "name") r.sort((a, b) => a.name.localeCompare(b.name));
  if (s === "awards") r.sort((a, b) => b.recognition.length - a.recognition.length);
  if (s === "scholar") r.sort((a, b) => (b.sort_scholar || 0) - (a.sort_scholar || 0));
  $("#list").innerHTML = r.map(c => `<div class="row${c.id === cur ? " sel" : ""}" data-id="${esc(c.id)}"><span class="h">${c.metrics ? "h " + c.metrics.h : ""}</span>
    <div class="n">${starBtn(c.id)}${esc(c.name)}${showJohn() && c.john ? `<span class="jstar" title="John's pick">★ John</span>` : ""}</div><div class="s">${esc(c.one_line || uniOf(c) || "—")}</div></div>`).join("") || `<div class="row">${f === "starred" ? "No starred researchers yet. Click the star next to a name to add one." : f === "hidden" ? "You have not hidden anyone." : f === "john" ? "John has not starred anyone yet." : "No match"}</div>`;
  refreshStars();
}
function lifeOf(c) {
  const y = s => (String(s || "").match(/\b(1[5-9]\d\d|20\d\d)\b/) || [])[0];
  const b = y(c.life?.born), d = y(c.life?.died);
  return b || d ? `<span class="life">${b ? (d ? `${b}–${d}` : "born " + b) : "died " + d}</span>` : "";
}
function sec(title, body) { return `<section><h3>${title}</h3>${body}</section>`; }
const gap = t => `<div class="gap">${t}</div>`;

function show(id) {
  const c = C.find(x => x.id === id); if (!c) return;
  cur = id;
  document.querySelectorAll(".row").forEach(r => r.classList.toggle("sel", r.dataset.id === id));
  history.replaceState(null, "", "#" + id);
  const chips = [];
  (c.categories || []).forEach(k => chips.push(`<span class="ok">${esc(k)}</span>`));
  if (c.stage) chips.push(`<span title="based on ${esc(c.stage_basis || "")}">${STAGE[c.stage]}</span>`);
  if (c.status && c.status !== "deceased") chips.push(`<span>${esc(c.status)}</span>`);
  if (c.domain?.label) chips.push(`<span>${esc(c.domain.label)}</span>`);
  (c.topics || []).forEach(t => chips.push(`<span>${esc(t)}</span>`));
  if (c.verification.crawl_records.length && !c.flags.length) chips.push(`<span class="ok">sourced, no flags</span>`);
  c.flags.forEach(f => chips.push(`<span class="${/memory|audit/.test(f) ? "bad" : "warn"}">${esc(f)}</span>`));
  let h = `<div class="card"><h2>${starBtn(c.id)}${esc(c.name)}${lifeOf(c)}<button class="hidebtn" data-hide="${esc(c.id)}">${hidden.has(c.id) ? "Unhide" : "Hide"}</button></h2><div class="one">${esc(c.one_line || "")}</div><div class="chips">${chips.join("")}</div>`;
  if (showJohn() && c.john) h += `<div class="jnote"><b>★ John's pick</b>${c.john.note ? " · " + esc(c.john.note) : ""}</div>`;

  // 2. why they matter
  const chk = k => k.checked === "supported" ? `<span class="tag ok">re-checked on source</span>` : k.checked === "trimmed" ? `<span class="tag ok">trimmed to what the source states</span>` : k.checked === "unverifiable" ? `<span class="tag bad">source would not open on re-check</span>` : "";
  let w = (c.known_for || []).map(k => `<p>${esc(k.text)}<br>${src(k.sources?.[0])} ${chk(k)}</p>`).join("");
  if (c.researcher_map) w += `<p>${esc(c.researcher_map.why)}<br>${src(c.researcher_map.source, "the classic map")}</p>`;
  if (c.known_for_list) w += `<p>Known for (Wikipedia): ${c.known_for_list.items.map(esc).join("; ")}<br>${src(c.known_for_list.source, "Wikipedia")}</p>`;
  if (c.also_described?.length) w += `<details><summary class="src">${c.also_described.length} other description(s)</summary>${c.also_described.map(k => `<p>${esc(k.text)}<br>${src(k.sources?.[0])}</p>`).join("")}</details>`;
  h += sec("Why they matter", w || gap("No sourced description yet."));

  // 3. where they work
  const W = c.where || {};
  let wh = "";
  if (W.university) wh += `<p><b>${esc(W.university)}</b>${W.dept ? " · " + esc(W.dept) : ""}${c.who?.title ? " · " + esc(c.who.title) : ""}<br>${src(W.sources?.[0])}</p>`;
  if (W.csrankings) wh += `<p>CSRankings lists: ${esc(W.csrankings.affiliation)} ${src("https://csrankings.org", "CSRankings")}</p>`;
  if (W.conflict) wh += `<p class="src">⚠ ${esc(W.conflict)}</p>`;
  if (c.posts?.length) wh += `<p>Posts on record:</p><ul>${c.posts.map(p => `<li>${esc(p.name)}${p.years ? ` (${p.years[0]}–${p.years[1]})` : ""} ${src(p.source, p.source?.includes("openalex") ? "OpenAlex" : "Wikipedia")}</li>`).join("")}</ul>`;
  h += sec("Where they work", wh || gap("No sourced affiliation yet."));

  // 4. training and lineage
  let t = "";
  if (c.training) {
    if (c.training.education?.length) t += `<p>Education: ${c.training.education.map(esc).join("; ")}</p>`;
    if (c.training.thesis) t += `<p>Thesis: <i>${esc(c.training.thesis)}</i>${c.training.thesis_year ? " (" + esc(c.training.thesis_year) + ")" : ""}</p>`;
    if (t) t += src(c.training.source, "Wikipedia");
  }
  if (c.advisors?.length) t += `<p>Doctoral advisor: ${c.advisors.map(a => `${esc(a.name)} ${src(a.source)}`).join("; ")}</p>`;
  if (c.students?.length) t += `<p>Doctoral students recorded (${c.students.length}):</p><ul>${c.students.slice(0, 40).map(s => `<li>${esc(s.name)} ${src(s.source)}</li>`).join("")}</ul>${c.students.length > 40 ? `<div class="src">and ${c.students.length - 40} more</div>` : ""}`;
  h += sec("Training and lineage", t || gap("No sourced training or advisor yet."));

  // 5. signature work
  const P = c.papers || [];
  const G = c.scholar;
  const top = G?.top_articles?.length ? `<p>Most cited on Google Scholar:</p><ul>${G.top_articles.map(a => `<li><a href="${esc(a.link)}" target="_blank" rel="noopener">${esc(a.title)}</a> (${esc(a.year || "")}) · ${(a.cited||0).toLocaleString()} citations<br><span class="src">${esc(a.authors || "")}${a.venue ? " · " + esc(a.venue) : ""}</span></li>`).join("")}</ul>${src(G.url, "Google Scholar profile, read " + G.fetched)}` : "";
  h += sec("Signature work", (P.length ? `<ul>${P.map(p => `<li><b>${p.link ? `<a href="${esc(p.link)}" target="_blank" rel="noopener">${esc(p.title)}</a>` : esc(p.title)}</b> (${esc(p.venue || "?")} ${esc(p.year || "")})${p.note ? `<br>${esc(p.note)}` : ""}${p.arxiv ? ` · <a href="${esc(p.arxiv)}" target="_blank" rel="noopener">arXiv</a>` : ""}${p.audit ? `<span class="tag ${p.audit === "pass" ? "ok" : "bad"}">authors ${p.audit === "pass" ? "re-checked" : esc(p.audit)}</span>` : ""}</li>`).join("")}</ul>` : (top ? "" : gap("No landmark papers recorded yet."))) + top);

  // 6. recognition
  let rc = "";
  if (c.recognition?.length) rc += `<ul>${c.recognition.map(a => `<li><b>${esc(a.award)}</b>${a.year ? ", " + esc(a.year) : ""}${a.paper ? ` — <i>${esc(a.paper)}</i>` : ""}${a.citation ? `<br>${esc(a.citation)}` : ""} ${src(a.source)}${/another/.test(a.match) ? `<span class="tag bad">check: namesake possible</span>` : ""}</li>`).join("")}</ul>`;
  if (c.awards_wikipedia) rc += `<p>Wikipedia infobox lists: ${c.awards_wikipedia.items.map(esc).join("; ")}<br>${src(c.awards_wikipedia.source, "Wikipedia")}</p>`;
  h += sec("Recognition", rc || gap("No sourced awards yet."));

  // 7. connections
  h += sec("Connections on the map", c.coauthors_on_map?.length ? `<p>${c.coauthors_on_map.map(x => `${esc(x.name)} (${x.w})`).join(", ")}</p><div class="src">co-authors on the map, by number of shared works</div>` : gap("No co-authors on the map yet."));

  // 8. scale
  let sc = "";
  if (c.metrics) sc += `<div class="stats"><div><b>${c.metrics.h}</b><small>h-index</small></div><div><b>${(c.metrics.cited||0).toLocaleString()}</b><small>citations</small></div><div><b>${(c.metrics.works||0).toLocaleString()}</b><small>works</small></div></div><p>${src(c.metrics.source.split(" ")[1], "OpenAlex")} <span class="src">· identity: ${esc(c.metrics.identity)}</span></p>`;
  if (G) sc += `<div class="stats"><div><b>${G.h}</b><small>h-index (Scholar)</small></div><div><b>${(G.citations||0).toLocaleString()}</b><small>citations (Scholar)</small></div><div><b>${(G.citations_recent||0).toLocaleString()}</b><small>since 2021</small></div><div><b>${G.i10}</b><small>i10</small></div></div><p>${src(G.url, "Google Scholar profile")} <span class="src">· read ${esc(G.fetched)} · profile name "${esc(G.name)}", ${esc(G.affiliation || "")}</span></p>`;
  if (c.csrankings) sc += `<p>${c.csrankings.ml_papers} papers at NeurIPS, ICML and ICLR, ${c.csrankings.years[0]}–${c.csrankings.years[1]} (author-adjusted ${c.csrankings.ml_adjusted}) ${src("https://csrankings.org", "CSRankings")}</p>`;
  h += sec("Scale", sc || gap("No confirmed metrics yet."));

  // 9. links
  const L = c.links || {};
  const links = [["Homepage", L.homepage], ["Google Scholar", L.scholar], ["Wikipedia", c.wikipedia], ["OpenAlex", L.openalex], ["ORCID", L.orcid], ["On the map", L.map]].filter(x => x[1]);
  h += sec("Links", links.length ? links.map(([k, v]) => `<a href="${esc(v)}" target="_blank" rel="noopener">${k}</a>`).join(" · ") : gap("No links yet."));

  // 10. provenance and gaps
  const A = c.added_by;
  if (A) {
    let ab = "";
    if (A.linked_to?.length) ab += `<p>Added in the breadth-first expansion: linked to ${A.linked_to.map(l => `<a href="#${esc(l.card)}">${esc(byId[l.card]?.name || l.card)}</a> (${esc(l.via)}) ${src(l.source)}`).join("; ")}</p>`;
    const sg = A.signals || {};
    if (sg.landmark_papers?.length) ab += `<p>Landmark papers on our lists: ${sg.landmark_papers.map(esc).join("; ")}</p>`;
    if (sg.awards?.length) ab += `<p>Awards on our lists: ${sg.awards.map(esc).join("; ")}</p>`;
    if (sg.students_with_cards?.length) ab += `<p>Doctoral students with cards: ${sg.students_with_cards.map(esc).join(", ")}</p>`;
    if (A.awards_basis?.length) ab += `<p>Added as an award winner: ${A.awards_basis.map(a => `${esc(a.award)}${a.year ? " " + esc(a.year) : ""} ${src(a.source)}`).join("; ")}</p>`;
    h += sec("Why this person was added", ab || gap("—"));
  }
  const V = c.verification;
  let pv = `<p>Records: ${V.crawl_records.length ? V.crawl_records.map(r => `${esc(r.slice)}${r.verified ? "" : " (unverified)"}`).join(", ") : "none"}</p>`;
  if (V.audit.length) pv += `<p>Source re-check: ${V.audit.map(a => `${esc(a.slice)} <span class="tag ${a.verdict === "pass" ? "ok" : "bad"}">${esc(a.verdict)}</span>`).join(" ")}</p>`;
  if (V.memory_seed_only) pv += `<p>This card is a name from the seed list only; nothing about the person has been sourced yet.</p>`;
  if (c.gaps.length) pv += `<p>Gaps: ${c.gaps.map(esc).join("; ")}</p>`;
  h += sec("Provenance and gaps", pv) + `</div>`;
  $("#card").innerHTML = h; $("#card").scrollTop = 0;
}
$("#list").addEventListener("click", e => { const b = e.target.closest("[data-star]"); if (b) { toggleStar(b.dataset.star); return; } const r = e.target.closest(".row"); if (r?.dataset.id) show(r.dataset.id); });
$("#card").addEventListener("click", e => { const b = e.target.closest("[data-star]"); if (b) toggleStar(b.dataset.star); const hb = e.target.closest("[data-hide]"); if (hb) toggleHide(hb.dataset.hide); });
$("#jp").addEventListener("change", () => { try { localStorage.setItem(JK, showJohn() ? "1" : "0"); } catch (e) {} if (!showJohn() && $("#show").value === "john") $("#show").value = ""; list(); if (cur) show(cur); });
$("#dl").addEventListener("click", e => {
  e.preventDefault();
  const rows = [...stars].map(id => ({ id, name: byId[id]?.name || id, university: byId[id] ? uniOf(byId[id]) : "" }));
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([JSON.stringify({ starred: rows, exported: new Date().toISOString() }, null, 1)], { type: "application/json" }));
