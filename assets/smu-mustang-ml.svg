<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" font-family="Georgia, 'Times New Roman', serif">
  <rect width="800" height="400" fill="#FDFAF4"/>
  <rect x="6" y="6" width="788" height="388" fill="none" stroke="#D4C5A9" stroke-width="2"/>

  <!-- galloping mustang, SMU red -->
  <g transform="translate(400 190)" fill="#A6192E">
    <!-- body -->
    <ellipse cx="0" cy="-10" rx="120" ry="46" transform="rotate(-4)"/>
    <!-- neck -->
    <path d="M 78 -34 C 96 -60, 110 -84, 118 -104 L 152 -86 C 140 -60, 128 -36, 118 -14 Z"/>
    <!-- head -->
    <path d="M 112 -108 C 116 -118, 128 -124, 140 -122 L 186 -100 C 192 -97, 192 -90, 185 -88 L 152 -80 C 136 -76, 120 -84, 114 -96 Z"/>
    <!-- ear -->
    <path d="M 124 -120 L 118 -140 L 134 -126 Z"/>
    <!-- mane -->
    <path d="M 112 -102 C 92 -96, 76 -76, 68 -52 C 62 -74, 78 -102, 104 -112 Z"/>
    <!-- front leg extended forward -->
    <path d="M 84 8 C 108 18, 138 26, 164 28 L 160 44 C 130 44, 98 36, 76 26 Z"/>
    <!-- front leg stepping -->
    <path d="M 58 18 C 62 40, 64 62, 62 82 L 44 80 C 46 58, 44 38, 40 20 Z"/>
    <!-- hind leg extended back -->
    <path d="M -86 4 C -112 18, -140 26, -168 28 L -172 12 C -146 8, -120 -2, -100 -14 Z"/>
    <!-- hind leg under -->
    <path d="M -60 16 C -64 40, -64 62, -60 84 L -78 84 C -82 60, -80 36, -76 14 Z"/>
    <!-- tail -->
    <path d="M -112 -28 C -146 -34, -176 -52, -192 -76 C -164 -64, -138 -56, -114 -52 Z"/>
    <!-- eye -->
    <circle cx="140" cy="-108" r="3.2" fill="#FDFAF4"/>
    <!-- ground -->
    <rect x="-210" y="92" width="420" height="5" fill="#C4A87A" rx="2.5"/>
  </g>

  <text x="400" y="352" text-anchor="middle" font-size="15" font-style="italic" fill="#8a7357">Machine Learning · SMU</text>
</svg>
