<title>scrocco — photographs</title>

<style>
  :root {
    --bg: #0b0b0c;
    --ink: #e6e4df;
    --dim: #8a8880;
    --hair: #232326;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: var(--bg); color: var(--ink);
    font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  a { color: inherit; text-decoration: none; }

  header {
    display: flex; align-items: baseline; gap: 20px;
    padding: 26px 4vw 22px;
    border-bottom: 1px solid var(--hair);
  }
  .mark {
    font-size: 15px; letter-spacing: 0.34em; text-transform: lowercase;
    font-weight: 400;
  }
  .mark b { font-weight: 700; }
  header .right { margin-left: auto; display: flex; gap: 22px; font-size: 12.5px; color: var(--dim); letter-spacing: 0.06em; }
  header .right a:hover { color: var(--ink); }

  .intro { padding: 9vh 4vw 6vh; }
  .intro h1 {
    font-weight: 300; font-size: clamp(1.3rem, 2.6vw, 1.9rem);
    letter-spacing: 0.01em; color: var(--ink); max-width: 34ch; line-height: 1.45;
  }
  .intro h1 span { color: var(--dim); }

  .gallery { padding: 0 4vw 10vh; }
  .gallery .album {
    font-size: 12.5px; letter-spacing: 0.3em; text-transform: uppercase;
    font-weight: 400; color: var(--dim); margin: 6vh 0 18px;
  }
  .gallery .album:first-child { margin-top: 0; }
  .album-grid { columns: 3; column-gap: 14px; }
  @media (max-width: 1000px) { .album-grid { columns: 2; } }
  @media (max-width: 620px)  { .album-grid { columns: 1; } }
  .gallery figure {
    break-inside: avoid; margin: 0 0 14px;
    background: #101012; overflow: hidden;
  }
  .gallery img {
    width: 100%; display: block; opacity: 0;
    transition: opacity 500ms ease, transform 400ms ease;
  }
  .gallery img.in { opacity: 1; }
  .gallery figure:hover img { transform: scale(1.015); }
  .empty { color: var(--dim); font-size: 14px; letter-spacing: 0.08em; }

  footer {
    padding: 5vh 4vw 8vh; border-top: 1px solid var(--hair);
    display: flex; gap: 24px; font-size: 12.5px; color: var(--dim); letter-spacing: 0.06em;
  }
  footer a:hover { color: var(--ink); }
  footer .copy { margin-left: auto; }
</style>

<script>
  // Fade images in as they load/enter view.
  const io = new IntersectionObserver((entries) => {
    for (const e of entries) {
      if (!e.isIntersecting) continue;
      const img = e.target;
      if (img.complete) img.classList.add('in');
      else img.addEventListener('load', () => img.classList.add('in'), { once: true });
      io.unobserve(img);
    }
  }, { rootMargin: '200px' });
  document.querySelectorAll('.gallery img').forEach(i => io.observe(i));
</script>
