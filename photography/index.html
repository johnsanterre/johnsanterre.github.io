<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>scrocco — photographs</title>
<meta name="description" content="Photography by John Santerre, shooting as scrocco.">
<style>
  :root {
    --paper: #f7f6f3;
    --ink: #1c1b18;
    --dim: #8a867c;
    --hair: #e5e2db;
    --accent: hsl(30, 8%, 32%);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: var(--paper); color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", Helvetica, Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  a { color: inherit; text-decoration: none; }
  header {
    display: flex; align-items: baseline; gap: 20px;
    padding: 26px 4vw 22px;
    border-bottom: 1px solid var(--hair);
  }
  .mark { font-size: 15px; letter-spacing: 0.34em; text-transform: lowercase; font-weight: 400; }
  .mark b { font-weight: 700; }
  header .right { margin-left: auto; display: flex; gap: 22px; font-size: 12.5px; color: var(--dim); letter-spacing: 0.06em; }
  header .right a:hover { color: var(--ink); }
  footer {
    padding: 5vh 4vw 8vh; border-top: 1px solid var(--hair);
    display: flex; flex-wrap: wrap; gap: 12px 24px; font-size: 12.5px; color: var(--dim); letter-spacing: 0.06em;
  }
  footer a:hover { color: var(--ink); }
  footer .copy { margin-left: auto; }

  .stories {
    padding: 7vh 4vw 10vh;
    display: grid; gap: 40px 34px;
    grid-template-columns: repeat(auto-fit, minmax(min(460px, 100%), 1fr));
  }
  .tile { display: block; }
  .tile .frame { overflow: hidden; background: #fff; border: 1px solid var(--hair); }
  .tile img {
    width: 100%; aspect-ratio: 3 / 2; object-fit: cover; display: block;
    transition: transform 700ms ease;
  }
  .tile:hover img { transform: scale(1.025); }
  .tile .label { display: flex; align-items: baseline; gap: 14px; padding: 14px 2px 0; }
  .tile .name {
    font-size: 13.5px; letter-spacing: 0.26em; text-transform: uppercase;
    font-weight: 650; color: var(--tile-accent, var(--accent));
  }
  .tile .count { font-size: 12px; color: var(--dim); letter-spacing: 0.08em; }

</style>
</head>
<body>

<header>
  <a class="mark" href="/photography/"><b>scrocco</b></a>
  <span class="right">
    <a href="/photography/prints.html">prints</a>
    <a href="https://www.instagram.com/scrocco/">instagram</a>
    <a href="/">john santerre — the academic side</a>
  </span>
</header>

<main class="stories">
  <a class="tile" href="bulgaria.html" style="--tile-accent: hsl(164, 30%, 34%)"><span class="frame"><img src="img/bulgaria/dsc00281.jpg" alt="Bulgaria"></span><span class="label"><span class="name">Bulgaria</span><span class="count">50 photographs</span></span></a>
  <a class="tile" href="guatemala.html" style="--tile-accent: hsl(30, 30%, 34%)"><span class="frame"><img src="img/guatemala/10786201.jpg" alt="Guatemala"></span><span class="label"><span class="name">Guatemala</span><span class="count">5 photographs</span></span></a>
  <a class="tile" href="haiti.html" style="--tile-accent: hsl(0, 30%, 34%)"><span class="frame"><img src="img/haiti/_mg_4966.jpg" alt="Haiti"></span><span class="label"><span class="name">Haiti</span><span class="count">7 photographs</span></span></a>
  <a class="tile" href="singles.html" style="--tile-accent: hsl(0, 30%, 34%)"><span class="frame"><img src="img/singles/_mg_2579.jpg" alt="Singles"></span><span class="label"><span class="name">Singles</span><span class="count">2 photographs</span></span></a>
  <a class="tile" href="thai-cambodia.html" style="--tile-accent: hsl(8, 30%, 34%)"><span class="frame"><img src="img/thai-cambodia/01.jpg" alt="Thai / Cambodia"></span><span class="label"><span class="name">Thai / Cambodia</span><span class="count">39 photographs</span></span></a>
  <a class="tile" href="venice.html" style="--tile-accent: hsl(25, 30%, 34%)"><span class="frame"><img src="img/venice/02a_mg_4478.jpg" alt="Venice"></span><span class="label"><span class="name">Venice</span><span class="count">8 photographs</span></span></a>
</main>

<footer>
  <a href="/photography/prints.html">prints</a>

  <span class="copy">© 2026 John Santerre</span>
</footer>

</body>
</html>
